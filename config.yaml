# This is the default configuration for LOCAL execution.
# It uses relative paths.

# --- Input Data ---
input_vcf: "data/raw_cohort.vcf.gz"
sample_info: "data/samples.tsv" # Format: sample_id, sex (M/F), country_code (ISO 3166)

# --- Reference Data Management ---
resources:
  ref_fasta_url: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz"

# --- Target Selection ---
target_genes: "resources/target_genes.txt" # List of gene symbols, one per line

# --- Pipeline Settings ---
output_prefix: "pgx_pilot" # Prefix for final VCF files
# Set to false (default) to automatically remove intermediate VCFs once downstream
# rules complete. Set to true to retain all intermediate VCF files.
keep_intermediate: false

# --- Quality Control Thresholds ---
# Site-level thresholds can be set to null to disable them (e.g. for non-GATK callers).
qc_thresholds:
  # Site-level variant QC filters (used by tag_variant_qc.py)
  #qual: 30.0
  #qd: 2.0
  #mq: 40.0
  #fs: 60.0
  #readpos: -8.0
  #hwe: 1e-6
  qual: None
  qd: None
  mq: None
  fs: None
  readpos: None
  hwe: None      
  max_missing: 0.1
  # Genotype-level masking thresholds (used by bcftools +setGT in mask_genotypes)
  min_dp: 10 # Format DP (FMT/DP)
  min_gq: 20 # Format GQ (FMT/GQ)
  ab_ratio: 0.2 # Heterozygous allele balance bounds [ab_ratio, 1 - ab_ratio]
